name: Build Jen CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS
          - os: macos
            runner: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos
            runner: macos-latest
            goos: darwin
            goarch: arm64

          # Linux
          - os: linux
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: linux
            runner: ubuntu-latest
            goos: linux
            goarch: 386
          - os: linux
            runner: ubuntu-latest
            goos: linux
            goarch: arm64

          # Windows
          - os: windows
            runner: windows-latest
            goos: windows
            goarch: amd64
          - os: windows
            runner: windows-latest
            goos: windows
            goarch: 386

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23 # or your desired version

      - name: Create build folder
        run: mkdir -p build

      - name: Build Jen CLI
        run: |
          BIN_NAME=jen-${{ matrix.os }}-${{ matrix.goarch }}
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN_NAME=${BIN_NAME}.exe
          fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o build/$BIN_NAME packages/cli/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jen-${{ matrix.os }}-${{ matrix.goarch }}
          path: build/*
