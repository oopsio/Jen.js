name: Build Jen CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # macOS
          - os: macos
            runner: macos-latest
            rust_target: x86_64-apple-darwin
          - os: macos
            runner: macos-latest
            rust_target: aarch64-apple-darwin

          # Linux
          - os: linux
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
          - os: linux
            runner: ubuntu-latest
            rust_target: i686-unknown-linux-gnu
          - os: linux
            runner: ubuntu-latest
            rust_target: aarch64-unknown-linux-gnu

          # Windows
          - os: windows
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - os: windows
            runner: windows-latest
            rust_target: i686-pc-windows-msvc

    runs-on: ${{ matrix.runner }}

    # All 'run' steps default to the CLI directory
    defaults:
      run:
        working-directory: crates/cli

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Speeds up your 11.3s build to ~2s on repeat runs
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates/cli -> ../../target"

      - name: Create build folder
        run: mkdir -p build

      - name: Build and Rename
        shell: bash
        run: |
          # Define names
          BIN_NAME=jen-${{ matrix.os }}-${{ matrix.rust_target }}
          RAW_BIN=jen
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            BIN_NAME=${BIN_NAME}.exe
            RAW_BIN=jen.exe
          fi

          # Build release for specific target
          cargo build --release --target ${{ matrix.rust_target }}

          # The Path Fix:
          # Current dir: [root]/crates/cli
          # Binary loc: [root]/target/[target]/release/[bin]
          cp ../../target/${{ matrix.rust_target }}/release/$RAW_BIN build/$BIN_NAME
          
          echo " Built: $BIN_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jen-${{ matrix.os }}-${{ matrix.rust_target }}
          path: crates/cli/build/*
