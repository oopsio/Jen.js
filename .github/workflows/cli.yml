name: Build Jen CLI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build CLI
    runs-on: ${{ matrix.os_runner }}
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            os_runner: ubuntu-latest
            goarch: 386
          - os: linux
            os_runner: ubuntu-latest
            goarch: amd64
          - os: linux
            os_runner: ubuntu-latest
            goarch: arm64
          # Windows
          - os: windows
            os_runner: windows-latest
            goarch: 386
          - os: windows
            os_runner: windows-latest
            goarch: amd64
          # macOS
          - os: macos
            os_runner: macos-latest
            goarch: amd64
          - os: macos
            os_runner: macos-latest
            goarch: arm64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Build CLI
        run: |
          mkdir -p build
          cd packages/cli
          echo "Building for OS=${{ matrix.os }} ARCH=${{ matrix.goarch }}"
          # module-less build
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.goarch }} GO111MODULE=off go build -o ../../build/jen-${{ matrix.os }}-${{ matrix.goarch }} main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jen-cli-${{ matrix.os }}-${{ matrix.goarch }}
          path: build/jen-${{ matrix.os }}-${{ matrix.goarch }}*
