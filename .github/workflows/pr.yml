name: Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        # Use --frozen-lockfile to ensure CI matches your local B:\ drive environment
        run: bun install --frozen-lockfile

      - name: Run Tests
        # This triggers your 934 passing vitest tests
        run: bun run test:run
