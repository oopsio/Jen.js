[package]
name = "jen-api"
version = "0.1.0"
edition = "2021"
description = "Rust API for Jen.js plugins and utilities"
license = "MIT"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-trait = "0.1"
tokio = { version = "1", features = ["full"], optional = true }
urlencoding = "2.1"

[features]
default = []
async = ["tokio"]

[profile.release]
opt-level = 3
lto = true
